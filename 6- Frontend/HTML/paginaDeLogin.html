<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagina de Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; font-family:"Space Grotesk", sans-serif; background:#f2efe9; color:#1c1c1c; display:grid; place-items:center; min-height:100vh; }
    .box { background:#fff; padding:24px; border-radius:12px; width:320px; box-shadow:0 12px 26px rgba(0,0,0,0.08); }
    label { display:block; margin-top:12px; font-weight:600; }
    input { width:100%; padding:10px; margin-top:6px; border:1px solid #ddd; border-radius:8px; }
    button { margin-top:16px; width:100%; padding:10px; border:none; border-radius:8px; background:#2a6f6f; color:#fff; }
  </style>
</head>
<body>
  <!-- PASSO A PASSO
       1) Caixa central
       2) Campo email e senha
       3) Botao login
  -->
  <div class="box">
    <h1>Login</h1>
    <label>Email</label>
    <input type="email" placeholder="voce@email.com" />

    <label>Senha</label>
    <input type="password" placeholder="********" />

    <button>Entrar</button>
  </div>
</body>
</html>
