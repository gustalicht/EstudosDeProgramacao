<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulario de Contato</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f7f5f0; --ink:#1c1c1c; --accent:#2a6f6f; }
    body { margin:0; font-family:"Space Grotesk", sans-serif; background:var(--bg); color:var(--ink); }
    .container { max-width:600px; margin:40px auto; padding:24px; background:#fff; border-radius:12px; box-shadow:0 12px 26px rgba(0,0,0,0.08); }
    label { display:block; margin-top:12px; font-weight:600; }
    input, textarea { width:100%; padding:10px; margin-top:6px; border:1px solid #ddd; border-radius:8px; }
    button { margin-top:16px; background:var(--accent); color:#fff; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <!-- PASSO A PASSO
       1) Criar form
       2) Adicionar labels e inputs
       3) Botao para enviar
  -->
  <div class="container">
    <h1>Contato</h1>
    <form>
      <label>Nome</label>
      <input type="text" placeholder="Seu nome" />

      <label>Email</label>
      <input type="email" placeholder="voce@email.com" />

      <label>Mensagem</label>
      <textarea rows="5" placeholder="Escreva aqui..."></textarea>

      <button type="submit">Enviar</button>
    </form>
  </div>
</body>
</html>
