<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagina de Artigo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; font-family:"Space Grotesk", sans-serif; background:#f8f4ef; color:#1c1c1c; }
    .container { max-width:760px; margin:0 auto; padding:40px 24px; }
    h1 { font-family:"Playfair Display", serif; }
    .meta { color:#6b625a; margin-bottom:24px; }
    p { line-height:1.7; }
  </style>
</head>
<body>
  <!-- PASSO A PASSO
       1) Titulo
       2) Metadados (autor, data)
       3) Paragrafos do artigo
  -->
  <div class="container">
    <h1>Titulo do Artigo</h1>
    <div class="meta">Por Autor | 03/02/2026</div>
    <p>Primeiro paragrafo com introducao do tema.</p>
    <p>Segundo paragrafo com mais detalhes e exemplos.</p>
    <p>Conclusao com resumo do aprendizado.</p>
  </div>
</body>
</html>
