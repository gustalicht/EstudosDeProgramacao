<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curriculo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f6f2ea; --ink:#1f1f1f; --accent:#c96b4b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Space Grotesk", sans-serif; background:var(--bg); color:var(--ink); }
    .container { max-width:900px; margin:0 auto; padding:40px 24px; }
    h1 { font-family:"Playfair Display", serif; margin:0; }
    .header { display:flex; justify-content:space-between; align-items:center; gap:24px; }
    .tag { color:#6b625a; }
    .section { background:#fff; padding:20px; border-radius:14px; margin-top:20px; box-shadow:0 10px 24px rgba(0,0,0,0.08); }
    .skills { display:flex; flex-wrap:wrap; gap:8px; }
    .skill { background:#f1e7db; padding:6px 10px; border-radius:999px; font-size:14px; }
  </style>
</head>
<body>
  <!-- PASSO A PASSO
       1) Cabecalho com nome e titulo
       2) Secao de resumo
       3) Experiencia e educacao
       4) Habilidades em tags
  -->
  <div class="container">
    <div class="header">
      <div>
        <h1>Gustavo Licht</h1>
        <p class="tag">Desenvolvedor em formacao</p>
      </div>
      <div>
        <p>email@exemplo.com</p>
        <p>(11) 99999-9999</p>
      </div>
    </div>

    <div class="section">
      <h2>Resumo</h2>
      <p>Texto curto explicando objetivos e areas de interesse.</p>
    </div>

    <div class="section">
      <h2>Experiencia</h2>
      <ul>
        <li>Projeto A - descricao breve</li>
        <li>Projeto B - descricao breve</li>
      </ul>
    </div>

    <div class="section">
      <h2>Habilidades</h2>
      <div class="skills">
        <span class="skill">C#</span>
        <span class="skill">SQL</span>
        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
      </div>
    </div>
  </div>
</body>
</html>
